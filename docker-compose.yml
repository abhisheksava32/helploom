# Production style stack: PostgreSQL with pgvector, Redis, the ASGI backend, a Celery
# worker, the Next.js frontend and Ollama.
#
#   cp .env.example .env        # set SECRET_KEY and POSTGRES_PASSWORD at least
#   docker compose up -d --build
#
# Put a TLS terminating proxy in front of ports 3000 and 8000 in production. For a
# plain HTTP trial on one machine set SECURE_SSL_REDIRECT=false in .env.

name: helploom

x-backend-environment: &backend-environment
  DEBUG: "false"
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  ALLOWED_HOSTS: ${API_HOSTNAME:-localhost},127.0.0.1,backend
  DATABASE_URL: postgres://helploom:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/helploom
  DB_CONN_MAX_AGE: "0"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
  PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8000}
  CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
  CSRF_TRUSTED_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
  REFRESH_COOKIE_DOMAIN: ${REFRESH_COOKIE_DOMAIN:-}
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
  MEDIA_ROOT: /app/media
  LLM_PROVIDER: ${LLM_PROVIDER:-auto}
  EMBEDDER: ${EMBEDDER:-auto}
  OLLAMA_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
  # Passed through from the host environment or .env; never baked into an image.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
  STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-localhost}
  EMAIL_PORT: ${EMAIL_PORT:-25}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Helploom <no-reply@helploom.local>}

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: helploom
      POSTGRES_USER: helploom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/, so the volume
      # mounts the parent directory (not .../data as with older versions).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helploom -d helploom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2.10-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One shot: applies migrations (including CREATE EXTENSION vector) before the
  # backend and worker start. All three share one image; the build is cached.
  migrate:
    build: ./backend
    image: helploom-backend
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    image: helploom-backend
    restart: unless-stopped
    environment: *backend-environment
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    build: ./backend
    image: helploom-backend
    restart: unless-stopped
    command: ["celery", "--app", "helploom", "worker", "--loglevel", "INFO", "--queues", "helploom", "--concurrency", "2"]
    environment: *backend-environment
    volumes:
      # Shares uploaded files with the backend, which stores them before queueing.
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8000}
        NEXT_PUBLIC_APP_URL: ${FRONTEND_URL:-http://localhost:3000}
    image: helploom-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.40.4
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # Uncomment on a host with an NVIDIA GPU and the container toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One shot: downloads the chat and embedding models into the ollama volume. Until
  # it finishes, LLM_PROVIDER=auto answers in extractive mode.
  ollama-pull:
    image: ollama/ollama:0.40.4
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-llama3.2} && ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text}"]
    depends_on:
      - ollama
    restart: on-failure

volumes:
  pgdata:
  redisdata:
  media:
  ollama:
